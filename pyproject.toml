[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "intellieffect-xswap"
version = "0.8.2"
description = "Account switching for Codex CLI, macOS desktop, and local OpenClaw"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Operating System :: MacOS",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Topic :: Software Development :: Tools",
]
requires-python = ">=3.11"
authors = [{name = "IntelliEffect"}]
dependencies = ["websockets>=15,<18"]

[dependency-groups]
dev = ["pytest>=8", "pytest-xdist>=3.5", "pytest-cov>=5"]

[project.scripts]
xswap = "codex_swap:main"
codex-swap = "codex_swap:main"
xswap-proxy = "xswap_live:proxy_main"
xswap-codex = "xswap_cli:codex_main"

[project.urls]
Repository = "https://github.com/intellieffect/xswap"

[tool.setuptools]
py-modules = ["codex_swap", "xswap_usage", "xswap_live", "xswap_cli", "xswap_plugins", "xswap_credentials", "xswap_upgrade", "xswap_display", "xswap_menubar", "xswap_doctor", "xswap_switch", "xswap_init", "xswap_completion", "xswap_openclaw_state", "xswap_alert", "xswap_relocate", "xswap_tick", "xswap_path"]
packages = ["xswap_bridge"]

[tool.setuptools.package-data]
xswap_bridge = ["*.mjs", "*.swift"]

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
select = ["F", "E9", "B", "UP"]

[tool.pytest.ini_options]
# The sources are flat top-level modules and the `test_*.py` files sit beside
# them in the repo root, so the root itself is the test path. `tests/` is
# excluded on purpose: it holds live smoke scripts (`live_*.py`,
# `plugin_runtime_smoke.py`) that drive a real Codex binary and are run by
# hand, not collected.
testpaths = ["."]
python_files = ["test_*.py"]
norecursedirs = ["tests", ".git", "build", "dist", ".venv", "*.egg-info"]
