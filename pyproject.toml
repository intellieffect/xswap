[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "intellieffect-xswap"
version = "0.8.2"
description = "Account switching for Codex CLI, macOS desktop, and local OpenClaw"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Operating System :: MacOS",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Topic :: Utilities",
]
requires-python = ">=3.11"
authors = [{name = "IntelliEffect"}]
dependencies = ["websockets>=15,<18"]

[dependency-groups]
dev = ["pytest>=8", "pytest-xdist>=3.5", "pytest-cov>=5"]

[project.scripts]
xswap = "xswap.manager:main"
codex-swap = "xswap.manager:main"
xswap-proxy = "xswap.live:proxy_main"
xswap-codex = "xswap.codex_cli:codex_main"

[project.urls]
Repository = "https://github.com/intellieffect/xswap"

[tool.hatch.build.targets.wheel]
packages = ["src/xswap"]
# Root-level compatibility shims kept for one release (INT-5607): `xswap`
# used to be a flat set of top-level modules, and an already-running older
# bridge process (or a script doing `import codex_swap`) may still import
# these by their old names. They live outside src/xswap/ on purpose, so they
# must be force-included explicitly -- hatchling only auto-packages
# `packages` entries.
force-include = { "codex_swap.py" = "codex_swap.py", "xswap_cli.py" = "xswap_cli.py" }

[tool.hatch.build.targets.sdist]
include = [
  "src/xswap/**",
  "tests/**",
  "codex_swap.py",
  "xswap_cli.py",
  "LICENSE",
  "README.md",
  "README.ko.md",
  "SECURITY.md",
  "CONTRIBUTING.md",
  "CHANGELOG.md",
  "pyproject.toml",
]

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
select = ["F", "E9", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
# `tests/live/` holds live smoke scripts (`live_*.py`, `plugin_runtime_smoke.py`)
# that drive a real Codex binary and are run by hand, not collected.
norecursedirs = ["live", ".git", "build", "dist", ".venv", "*.egg-info"]
