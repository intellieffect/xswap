[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "intellieffect-xswap"
version = "0.8.2"
description = "Account switching for Codex CLI, macOS desktop, and local OpenClaw (Codex is the only provider today)"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
keywords = ["codex", "cli", "account-switching", "openclaw", "chatgpt", "quota"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Operating System :: MacOS",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Utilities",
]
requires-python = ">=3.11"
authors = [{name = "IntelliEffect"}]
dependencies = ["websockets>=15,<18"]

[dependency-groups]
dev = ["pytest>=8", "pytest-xdist>=3.5", "pytest-cov>=5", "pyright==1.1.407"]

[project.scripts]
xswap = "xswap.cli:main"
codex-swap = "xswap.cli:main"
xswap-proxy = "xswap.live:proxy_main"
xswap-codex = "xswap.codex_cli:codex_main"

[project.urls]
Repository = "https://github.com/intellieffect/xswap"
Issues = "https://github.com/intellieffect/xswap/issues"
Changelog = "https://github.com/intellieffect/xswap/blob/main/CHANGELOG.md"

[tool.hatch.build.targets.wheel]
packages = ["src/xswap"]
# Root-level compatibility shims kept for one release (INT-5607): `xswap`
# used to be a flat set of top-level modules, and an already-running older
# bridge process (or a script doing `import codex_swap`) may still import
# these by their old names. They live outside src/xswap/ on purpose, so they
# must be force-included explicitly -- hatchling only auto-packages
# `packages` entries.
force-include = { "codex_swap.py" = "codex_swap.py", "xswap_cli.py" = "xswap_cli.py" }

[tool.hatch.build.targets.sdist]
include = [
  "src/xswap/**",
  "tests/**",
  "codex_swap.py",
  "xswap_cli.py",
  "LICENSE",
  "README.md",
  "README.ko.md",
  "SECURITY.md",
  "CONTRIBUTING.md",
  "CHANGELOG.md",
  "pyproject.toml",
]

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
select = ["F", "E9", "B", "UP", "I", "SIM", "RUF", "PTH", "S"]

[tool.ruff.lint.per-file-ignores]
# Tests intentionally use assert, raw open()/os.path, and touch real-looking paths
# under tmp fixtures; scoping the newer rules to src/ keeps the suite noise-free.
# SIM/RUF (mostly RUF059 on multi-value fixture unpacking like
# `settings, shim, cli, updated, path = self.relative_shim()`, where a name is kept
# even when a given test does not read it, for readability/symmetry across the
# suite) are pre-existing style, not something INT-5612 touches; isort (I001) was
# applied to tests/ directly instead of ignored.
"tests/**" = ["S", "PTH", "SIM", "RUF"]
# The alias-shim type stubs (INT-5612) exist solely to tell pyright to treat
# `from xswap.<name> import X` as `from <target> import X`; `import *` is the point.
"src/xswap/*.pyi" = ["F403"]
# These four modules compare os.readlink()'s str result directly against other str
# values (dict fields, other readlink() calls) and thread it into str-typed helpers;
# Path.readlink() returns a Path, which would silently break those comparisons (a
# behavior change the checker itself must not force -- INT-5612).
"src/xswap/providers/codex/wrapper.py" = ["PTH115"]
"src/xswap/providers/codex/plugins.py" = ["PTH115"]
"src/xswap/providers/codex/relocate.py" = ["PTH115"]
"src/xswap/providers/codex/doctor.py" = ["PTH115"]

[tool.pyright]
include = ["src"]
# The flat top-level alias shims (`sys.modules[__name__] = <moved module>`, e.g.
# src/xswap/identity.py) are intentionally NOT excluded: excluding them made pyright
# forget they re-export their target module's names, which then broke every real
# module that does `from xswap.identity import identity` and similar (INT-5612).
# They typecheck fine as-is -- each is a couple of imports plus one assignment --
# so there is nothing for an exclude to protect here.
pythonVersion = "3.11"
typeCheckingMode = "basic"
reportMissingImports = "error"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
# `tests/live/` holds live smoke scripts (`live_*.py`, `plugin_runtime_smoke.py`)
# that drive a real Codex binary and are run by hand, not collected.
norecursedirs = ["live", ".git", "build", "dist", ".venv", "*.egg-info"]
