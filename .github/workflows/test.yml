name: Test
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ['3.11', '3.14']
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - run: python -m unittest discover -v
      - run: node --test tests/*.test.mjs
      - run: python -m pip install .
      - run: xswap --version
        working-directory: ${{ runner.temp }}
      - run: python -c "from importlib.resources import files; assert files('xswap_bridge').joinpath('openclaw.mjs').is_file(); assert files('xswap_bridge').joinpath('MenuBar.swift').is_file()"
        working-directory: ${{ runner.temp }}
      - name: Compile macOS menu app
        if: runner.os == 'macOS'
        run: xcrun swiftc xswap_bridge/MenuBar.swift -o /tmp/xswap-menu-test -framework AppKit
