name: Test
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ['3.11', '3.14']
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
      - run: python -m pip install ruff==0.16.6 && ruff check .
      - run: python -m unittest discover -v
      - run: node --test tests/*.test.mjs
      - run: python -m pip install .
      - run: xswap --version
        working-directory: ${{ runner.temp }}
      - run: python -c "from importlib.resources import files; assert files('xswap_bridge').joinpath('openclaw.mjs').is_file(); assert files('xswap_bridge').joinpath('MenuBar.swift').is_file()"
        working-directory: ${{ runner.temp }}
      - name: Compile macOS menu app
        if: runner.os == 'macOS'
        run: xcrun swiftc xswap_bridge/MenuBar.swift -o /tmp/xswap-menu-test -framework AppKit
