name: Security
on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '21 7 * * 1'
permissions:
  contents: read
jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Scan Git history for secrets
        env:
          GITLEAKS_VERSION: 8.30.1
        run: |
          curl --fail --silent --show-error --location --output /tmp/gitleaks.tar.gz "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl --fail --silent --show-error --location --output /tmp/checksums.txt "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          python3 - <<'PYCODE'
          import hashlib, os
          from pathlib import Path
          name = 'gitleaks_' + os.environ['GITLEAKS_VERSION'] + '_linux_x64.tar.gz'
          rows = [line.split() for line in Path('/tmp/checksums.txt').read_text().splitlines()]
          expected = next(digest for digest, filename in rows if filename == name)
          assert hashlib.sha256(Path('/tmp/gitleaks.tar.gz').read_bytes()).hexdigest() == expected
          PYCODE
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
          /tmp/gitleaks git . --log-opts=--all --redact=100 --no-banner
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.14'
      - name: Audit runtime dependencies
        run: |
          python -m pip install pip-audit
          python -c "import tomllib; print('\n'.join(tomllib.load(open('pyproject.toml', 'rb'))['project']['dependencies']))" > /tmp/xswap-requirements.txt
          pip-audit -r /tmp/xswap-requirements.txt --strict
